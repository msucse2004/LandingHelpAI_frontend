<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="auth.reset_password.page_title" data-i18n-default="Set new password - Landing Help AI">Set new password - Landing Help AI</title>
  <link rel="stylesheet" href="../assets/css/reset.css" /><link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/utilities.css" />
</head>
<body class="lhai-public-page" data-lhai-i18n-domains="common,auth">
  <main class="lhai-container">
    <section class="lhai-card lhai-card--center">
      <header class="lhai-page-header">
        <div>
          <h1 class="lhai-title" data-i18n="auth.reset_password.title" data-i18n-default="Set new password">Set new password</h1>
          <p class="lhai-subtitle" data-i18n="auth.reset_password.subtitle" data-i18n-default="Open this page from the email link or paste the token from the email, then set a new password.">Open this page from the email link or paste the token from the email, then set a new password.</p>
        </div>
      </header>
      <form class="lhai-form" id="resetPasswordForm">
        <label class="lhai-label" for="token" data-i18n="auth.reset_password.token_label" data-i18n-default="Reset token">Reset token</label>
        <input class="lhai-input" id="token" name="token" type="text" required autocomplete="off" minlength="8" />
        <label class="lhai-label" for="newPassword" data-i18n="auth.reset_password.new_password_label" data-i18n-default="New password">New password</label>
        <input class="lhai-input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="4" />
        <label class="lhai-label" for="passwordConfirm" data-i18n="auth.reset_password.confirm_password_label" data-i18n-default="Confirm new password">Confirm new password</label>
        <input class="lhai-input" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="4" />
        <button class="lhai-button lhai-button--primary" type="submit" data-i18n="auth.reset_password.submit" data-i18n-default="Change password">Change password</button>
      </form>
      <p class="lhai-help" id="resetPasswordStatus" role="status" aria-live="polite"></p>
      <p class="u-mt-2">
        <a href="forgot-password.html" data-i18n="auth.reset_password.link_resend" data-i18n-default="Resend reset link">Resend reset link</a>
        ·
        <a href="login.html" data-i18n="auth.reset_password.link_login" data-i18n-default="Sign in">Sign in</a>
      </p>
    </section>
  </main>
  <script type="module" src="../assets/js/core/public-page-language-boot.js" data-i18n-domains="common,auth"></script>
  <script type="module" src="../assets/js/pages/reset-password.js"></script>
</body>
</html>

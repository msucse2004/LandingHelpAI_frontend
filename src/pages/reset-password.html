<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>새 비밀번호 설정 - Landing Help AI</title>
  <link rel="stylesheet" href="../assets/css/reset.css" /><link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/utilities.css" />
</head>
<body>
  <main class="lhai-container">
    <section class="lhai-card lhai-card--center">
      <header class="lhai-page-header">
        <div>
          <h1 class="lhai-title">새 비밀번호 설정</h1>
          <p class="lhai-subtitle">이메일로 받은 링크에서 열었거나, 메일에 적힌 토큰을 아래에 입력한 뒤 새 비밀번호를 설정하세요.</p>
        </div>
      </header>
      <form class="lhai-form" id="resetPasswordForm">
        <label class="lhai-label" for="token">재설정 토큰</label>
        <input class="lhai-input" id="token" name="token" type="text" required autocomplete="off" minlength="8" />
        <label class="lhai-label" for="newPassword">새 비밀번호</label>
        <input class="lhai-input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="4" />
        <label class="lhai-label" for="passwordConfirm">새 비밀번호 확인</label>
        <input class="lhai-input" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="4" />
        <button class="lhai-button lhai-button--primary" type="submit">비밀번호 변경</button>
      </form>
      <p class="lhai-help" id="resetPasswordStatus" role="status" aria-live="polite"></p>
      <p class="u-mt-2">
        <a href="forgot-password.html">재설정 링크 다시 받기</a>
        ·
        <a href="login.html">로그인</a>
      </p>
    </section>
  </main>
  <script type="module" src="../assets/js/pages/reset-password.js"></script>
</body>
</html>

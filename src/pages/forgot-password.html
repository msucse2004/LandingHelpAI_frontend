<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="auth.forgot_password.page_title" data-i18n-default="Reset password - Landing Help AI">Reset password - Landing Help AI</title>
  <link rel="stylesheet" href="../assets/css/reset.css" /><link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/utilities.css" />
</head>
<body class="lhai-public-page" data-lhai-i18n-domains="common,auth">
  <main class="lhai-container">
    <section class="lhai-card lhai-card--center">
      <header class="lhai-page-header">
        <div>
          <h1 class="lhai-title" data-i18n="auth.forgot_password.title" data-i18n-default="Reset password">Reset password</h1>
          <p class="lhai-subtitle" data-i18n="auth.forgot_password.subtitle" data-i18n-default="We will email a reset link to your signup email. Open the link to set a new password.">We will email a reset link to your signup email. Open the link to set a new password.</p>
        </div>
      </header>
      <form class="lhai-form" id="forgotPasswordForm">
        <label class="lhai-label" for="email" data-i18n="common.labels.email" data-i18n-default="Email">Email</label>
        <input class="lhai-input" id="email" name="email" type="email" autocomplete="email" required placeholder="example@email.com" />
        <button class="lhai-button lhai-button--primary" type="submit" data-i18n="auth.forgot_password.submit" data-i18n-default="Send reset link">Send reset link</button>
      </form>
      <p class="lhai-help" id="forgotPasswordStatus" role="status" aria-live="polite"></p>
      <p class="u-mt-2"><a href="login.html" data-i18n="auth.forgot_password.back_login" data-i18n-default="Back to sign in">Back to sign in</a></p>
    </section>
  </main>
  <script type="module" src="../assets/js/core/public-page-language-boot.js" data-i18n-domains="common,auth"></script>
  <script type="module" src="../assets/js/pages/forgot-password.js"></script>
</body>
</html>

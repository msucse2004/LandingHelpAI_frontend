<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-i18n="auth.login.page_title" data-i18n-default="Sign in - Landing Help AI">Sign in - Landing Help AI</title>

  <link rel="stylesheet" href="../assets/css/reset.css" /><link rel="stylesheet" href="../assets/css/tokens.css" />

  <link rel="stylesheet" href="../assets/css/layout.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/utilities.css" />

</head>

<body class="lhai-public-page" data-lhai-i18n-domains="common,auth">

  <main class="lhai-container">

    <section class="lhai-card lhai-card--center">

      <header class="lhai-page-header">

        <div>

          <h1 class="lhai-title" data-i18n="common.actions.sign_in" data-i18n-default="Sign in">Sign in</h1>

          <p class="lhai-subtitle" data-i18n="auth.login.subtitle" data-i18n-default="Sign in with your username and password. You can use either your username or email.">Sign in with your username and password. You can use either your username or email.</p>

        </div>

      </header>

      <form class="lhai-form" id="loginForm">

        <label class="lhai-label" for="loginId" data-i18n="common.labels.username_or_email" data-i18n-default="Username or email">Username or email</label>

        <input class="lhai-input" id="loginId" name="loginId" type="text" autocomplete="username" required data-i18n-placeholder="common.labels.username_or_email" data-i18n-default="Username or email" placeholder="Username or email" />

        <label class="lhai-label" for="password" data-i18n="common.labels.password" data-i18n-default="Password">Password</label>

        <input class="lhai-input" id="password" name="password" type="password" autocomplete="current-password" required />

        <button class="lhai-button lhai-button--primary" type="submit" data-i18n="common.actions.sign_in" data-i18n-default="Sign in">Sign in</button>

      </form>

      <p class="lhai-help" id="loginStatus" data-i18n="auth.login.verified_only" data-i18n-default="Only accounts with verified email can sign in.">Only accounts with verified email can sign in.</p>

      <p class="u-mt-2">

        <a href="signup.html" data-i18n="common.actions.create_account" data-i18n-default="Create account">Create account</a>

        ·

        <a href="find-username.html" data-i18n="common.actions.find_username" data-i18n-default="Find username">Find username</a>

        ·

        <a href="forgot-password.html" data-i18n="common.actions.reset_password" data-i18n-default="Reset password">Reset password</a>

      </p>

    </section>

  </main>

  <script type="module" src="../assets/js/core/public-page-language-boot.js" data-i18n-domains="common,auth"></script>

  <script type="module" src="../assets/js/pages/login.js"></script>

</body>

</html>

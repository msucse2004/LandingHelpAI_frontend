<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="common.dashboard.meta.title" data-i18n-default="Customer dashboard - Landing Help AI">Customer dashboard - Landing Help AI</title>
  <link rel="stylesheet" href="../assets/css/reset.css" /><link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/utilities.css" />
  <link rel="stylesheet" href="../assets/css/pages/dashboard.css" />
</head>
<body data-lhai-page="customer-dashboard" data-lhai-i18n-domains="common,nav,dashboard">
  <div id="lhai-app-header-root"></div>
  <div class="lhai-layout">
    <aside class="lhai-sidebar" id="sidebar" data-i18n-aria-label="common.sidebar.customer.aria_label" data-i18n-default="Customer menu" aria-label="Customer menu"></aside>
    <main class="lhai-main lhai-dashboard">
      <header class="lhai-dashboard-page-header">
        <div>
          <h1 class="lhai-title" data-i18n="common.dashboard.header.title" data-i18n-default="Dashboard">Dashboard</h1>
          <p class="lhai-subtitle" id="dashboardHeaderSubtitle" data-i18n="common.dashboard.header.subtitle" data-i18n-default="See what you need to do next.">See what you need to do next.</p>
        </div>
      </header>

      <section id="dashboardActionHero" class="lhai-dashboard-hero" aria-live="polite" data-i18n-aria-label="common.dashboard.action_hero.aria_label" data-i18n-default="What to do next" aria-label="What to do next"></section>

      <div class="lhai-dashboard-summary-row">
        <section id="dashboardStatusSummary" class="lhai-dashboard-summary-card lhai-card" data-i18n-aria-label="common.dashboard.status_summary.aria_label" data-i18n-default="Status summary" aria-label="Status summary"></section>
        <section id="dashboardQuoteSummary" class="lhai-dashboard-quote-card lhai-card" hidden data-i18n-aria-label="common.dashboard.quote_summary.aria_label" data-i18n-default="Quote comparison" aria-label="Quote comparison"></section>
      </div>

      <section id="dashboardProgressStepper" class="lhai-dashboard-stepper-card lhai-card" data-i18n-aria-label="common.dashboard.progress.aria_label" data-i18n-default="Progress steps" aria-label="Progress steps"></section>

      <section id="dashboardRecentUpdates" class="lhai-dashboard-updates-card lhai-card" data-i18n-aria-label="common.dashboard.recent_updates.aria_label" data-i18n-default="Recent updates" aria-label="Recent updates"></section>

      <section class="lhai-dashboard-compact-grid" data-i18n-aria-label="common.dashboard.compact_grid.aria_label" data-i18n-default="Documents and checklist" aria-label="Documents and checklist">
        <article id="dashboardDocumentsCompact" class="lhai-dashboard-compact-card lhai-card" data-i18n-aria-label="common.dashboard.documents.aria_label" data-i18n-default="Documents" aria-label="Documents"></article>
        <article id="dashboardChecklistCompact" class="lhai-dashboard-compact-card lhai-card" data-i18n-aria-label="common.dashboard.checklist.aria_label" data-i18n-default="Checklist" aria-label="Checklist"></article>
      </section>

      <section id="dashboardCasesCompact" class="lhai-dashboard-cases-card lhai-card" data-i18n-aria-label="common.dashboard.cases.aria_label" data-i18n-default="Service inquiries" aria-label="Service inquiries"></section>
    </main>
  </div>
  <script type="module" src="../assets/js/core/app-header.js"></script>
  <script type="module" src="../assets/js/core/logout-button.js"></script>
  <script type="module" src="../assets/js/core/admin-user-menu.js"></script>
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>

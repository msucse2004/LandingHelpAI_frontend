<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="common.dashboard.meta.title">고객 대시보드 - Landing Help AI</title>
  <link rel="stylesheet" href="../assets/css/reset.css" /><link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/utilities.css" />
  <link rel="stylesheet" href="../assets/css/pages/dashboard.css" />
</head>
<body data-lhai-page="customer-dashboard">
  <div id="lhai-app-header-root"></div>
  <div class="lhai-layout">
    <aside class="lhai-sidebar" id="sidebar"></aside>
    <main class="lhai-main lhai-dashboard">
      <header class="lhai-dashboard-page-header">
        <div>
          <h1 class="lhai-title" data-i18n="common.dashboard.header.title">대시보드</h1>
          <p class="lhai-subtitle" id="dashboardHeaderSubtitle" data-i18n="common.dashboard.header.subtitle">지금 필요한 일을 빠르게 확인하세요.</p>
        </div>
      </header>

      <section id="dashboardActionHero" class="lhai-dashboard-hero" aria-live="polite" aria-label="지금 할 일"></section>

      <div class="lhai-dashboard-summary-row">
        <section id="dashboardStatusSummary" class="lhai-dashboard-summary-card lhai-card" aria-label="진행 상태 요약"></section>
        <section id="dashboardQuoteSummary" class="lhai-dashboard-quote-card lhai-card" hidden aria-label="견적 비교"></section>
      </div>

      <section id="dashboardProgressStepper" class="lhai-dashboard-stepper-card lhai-card" aria-label="진행 단계"></section>

      <section id="dashboardRecentUpdates" class="lhai-dashboard-updates-card lhai-card" aria-label="최근 업데이트"></section>

      <section class="lhai-dashboard-compact-grid" aria-label="문서 및 체크리스트">
        <article id="dashboardDocumentsCompact" class="lhai-dashboard-compact-card lhai-card" aria-label="문서"></article>
        <article id="dashboardChecklistCompact" class="lhai-dashboard-compact-card lhai-card" aria-label="체크리스트"></article>
      </section>

      <section id="dashboardCasesCompact" class="lhai-dashboard-cases-card lhai-card" aria-label="서비스 문의"></section>
    </main>
  </div>
  <script type="module" src="../assets/js/core/app-header.js"></script>
  <script type="module" src="../assets/js/core/logout-button.js"></script>
  <script type="module" src="../assets/js/core/admin-user-menu.js"></script>
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
